[project]
name = "astrbot-plugin-iris-memory"
version = "4.0.0.dev0"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29"]

[dependency-groups]
dev = ["pillow>=11.2.1,<13", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "respx>=0.22,<0.23", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--tb=short"
markers = ["integration: real offline iris-core service (requires IRIS_CORE_PATH)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
